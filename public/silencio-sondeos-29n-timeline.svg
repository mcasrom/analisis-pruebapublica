<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" role="img" aria-label="Cronología: último dato público el 23 de noviembre, veda del 24 al 28, votación el 29 y resultados después.">
  <rect width="1000" height="260" fill="#f7f2e8"/>
  <text x="40" y="40" font-family="system-ui,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#b45309">CRONOLOGÍA DEL APAGÓN</text>
  <line x1="70" y1="145" x2="930" y2="145" stroke="#c9bda9" stroke-width="3"/>
  <circle cx="120" cy="145" r="8" fill="#173a5e"/><text x="120" y="120" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#173a5e">23-NOV</text><text x="120" y="177" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#44546a">Último dato</text><text x="120" y="193" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#44546a">público</text>
  <circle cx="390" cy="145" r="8" fill="#c2410c"/><text x="390" y="120" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#c2410c">24–28-NOV</text><text x="390" y="177" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#44546a">Veda legal</text><text x="390" y="193" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#44546a">sin publicar sondeos</text>
  <circle cx="650" cy="145" r="8" fill="#9f1239"/><text x="650" y="120" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#9f1239">29-NOV</text><text x="650" y="177" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#44546a">Jornada electoral</text><text x="650" y="193" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#44546a">cierre de urnas</text>
  <circle cx="870" cy="145" r="8" fill="#1f7a5a"/><text x="870" y="120" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#1f7a5a">DESPUÉS</text><text x="870" y="177" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#44546a">Resultados y</text><text x="870" y="193" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#44546a">nueva medición</text>
  <text x="40" y="238" font-family="system-ui,sans-serif" font-size="12" fill="#5f6f85">La veda limita la publicación y difusión de sondeos; no impide realizar encuestas internas.</text>
</svg>
