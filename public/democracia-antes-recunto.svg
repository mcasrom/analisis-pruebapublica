<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-label="Tres mecanismos: Estados Unidos, Brasil e Israel">
<rect width="1000" height="330" fill="#0f172a"/>
<text x="50" y="48" fill="#f97316" font-family="sans-serif" font-size="18" font-weight="700">TRES MECANISMOS, NO TRES EQUIVALENCIAS</text>
<g font-family="sans-serif">
<rect x="50" y="85" width="280" height="190" rx="12" fill="#111b2e" stroke="#334155"/>
<text x="74" y="122" fill="#fff" font-size="22" font-weight="700">EE. UU.</text>
<text x="74" y="153" fill="#94a3b8" font-size="15">Narrativa de fraude</text>
<text x="74" y="176" fill="#94a3b8" font-size="15">Disputa institucional</text>
<text x="74" y="214" fill="#38bdf8" font-size="14">Prueba: tribunales y</text>
<text x="74" y="234" fill="#38bdf8" font-size="14">certificaciones</text>
<rect x="360" y="85" width="280" height="190" rx="12" fill="#111b2e" stroke="#334155"/>
<text x="384" y="122" fill="#fff" font-size="22" font-weight="700">Brasil</text>
<text x="384" y="153" fill="#94a3b8" font-size="15">Impugnación electoral</text>
<text x="384" y="176" fill="#94a3b8" font-size="15">Investigación + salida</text>
<text x="384" y="214" fill="#38bdf8" font-size="14">Prueba: TSE y PF;</text>
<text x="384" y="234" fill="#38bdf8" font-size="14">ruta = prensa</text>
<rect x="670" y="85" width="280" height="190" rx="12" fill="#111b2e" stroke="#334155"/>
<text x="694" y="122" fill="#fff" font-size="22" font-weight="700">Israel</text>
<text x="694" y="153" fill="#94a3b8" font-size="15">Disputa por el voto</text>
<text x="694" y="176" fill="#94a3b8" font-size="15">de una comunidad</text>
<text x="694" y="214" fill="#38bdf8" font-size="14">Prueba: autoridad</text>
<text x="694" y="234" fill="#38bdf8" font-size="14">electoral; resultados</text>
</g></svg>
