<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="t2 d2">
<title id="t2">Media de 14 días y rango observado</title>
<desc id="d2">PP 31,5 con rango 29,7 a 33,0. PSOE 26,5 con rango 24,6 a 29,9. VOX 19,1 con rango 18,0 a 19,9. SUMAR 6,8 con rango 4,4 a 8,1.</desc>
<rect width="760" height="360" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="32" y="40" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#0f172a">Media de 14 días y rango observado</text>
<text x="32" y="63" font-family="system-ui,sans-serif" font-size="13" fill="#475569">14 sondeos · 10 casas · último 9-N · % de voto</text>
<line x1="185" y1="85" x2="185" y2="315" stroke="#e2e8f0"/>
<text x="185" y="330" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">0</text>
<line x1="332" y1="85" x2="332" y2="315" stroke="#e2e8f0"/>
<text x="332" y="330" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">10</text>
<line x1="479" y1="85" x2="479" y2="315" stroke="#e2e8f0"/>
<text x="479" y="330" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">20</text>
<line x1="626" y1="85" x2="626" y2="315" stroke="#e2e8f0"/>
<text x="626" y="330" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">30</text>
<text x="170" y="110" text-anchor="end" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#0f172a">PP</text>
<line x1="622" y1="105" x2="671" y2="105" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
<circle cx="648" cy="105" r="7" fill="#2563eb" stroke="#fff" stroke-width="2"/>
<text x="660" y="95" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#1e40af" stroke="#ffffff" stroke-width="3" paint-order="stroke">31,5%</text>
<text x="170" y="162" text-anchor="end" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#0f172a">PSOE</text>
<line x1="547" y1="157" x2="625" y2="157" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
<circle cx="575" cy="157" r="7" fill="#2563eb" stroke="#fff" stroke-width="2"/>
<text x="587" y="147" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#1e40af" stroke="#ffffff" stroke-width="3" paint-order="stroke">26,5%</text>
<text x="170" y="214" text-anchor="end" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#0f172a">VOX</text>
<line x1="450" y1="209" x2="478" y2="209" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
<circle cx="466" cy="209" r="7" fill="#2563eb" stroke="#fff" stroke-width="2"/>
<text x="478" y="199" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#1e40af" stroke="#ffffff" stroke-width="3" paint-order="stroke">19,1%</text>
<text x="170" y="266" text-anchor="end" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#0f172a">SUMAR</text>
<line x1="250" y1="261" x2="304" y2="261" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
<circle cx="285" cy="261" r="7" fill="#2563eb" stroke="#fff" stroke-width="2"/>
<text x="297" y="251" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#1e40af" stroke="#ffffff" stroke-width="3" paint-order="stroke">6,8%</text>
<text x="32" y="350" font-family="system-ui,sans-serif" font-size="11.5" fill="#475569">El rango es la dispersión entre sondeos, no un intervalo de confianza ni una probabilidad.</text>
</svg>