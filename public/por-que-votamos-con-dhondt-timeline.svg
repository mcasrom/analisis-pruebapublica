<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-label="Cronología: reforma política en 1976, real decreto electoral en marzo de 1977, elecciones en junio de 1977, Constitución en 1978 y LOREG en 1985. La Constitución no fijó la fórmula D'Hondt.">
  <rect width="1000" height="300" fill="#f7f2e8"/>
  <text x="44" y="44" font-family="ui-monospace, monospace" font-size="13" font-weight="700" letter-spacing="2" fill="#b45309">CRONOLOGÍA · LA REGLA LLEGÓ ANTES</text>
  <text x="44" y="76" font-family="Georgia, serif" font-size="25" font-weight="700" fill="#15202b">La Constitución de 1978 no inventó el sistema electoral.</text>
  <line x1="64" y1="166" x2="936" y2="166" stroke="#c9bda9" stroke-width="3"/>
  <!-- puntos -->
  <circle cx="95" cy="166" r="8" fill="#F97316"/>
  <circle cx="245" cy="166" r="8" fill="#F97316"/>
  <circle cx="395" cy="166" r="8" fill="#F97316"/>
  <circle cx="545" cy="166" r="8" fill="#F97316"/>
  <circle cx="695" cy="166" r="8" fill="#173a5e"/>
  <circle cx="875" cy="166" r="8" fill="#173a5e"/>
  <!-- fechas y etiquetas arriba -->
  <text x="95" y="145" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#b45309">1976</text>
  <text x="95" y="198" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#44546a">Cortes aprueban</text>
  <text x="95" y="214" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#44546a">la reforma</text>
  <text x="245" y="145" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#b45309">15-DIC-1976</text>
  <text x="245" y="198" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#44546a">Referéndum</text>
  <text x="395" y="145" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#b45309">18-MAR-1977</text>
  <text x="395" y="198" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#44546a">Real Decreto-ley</text>
  <text x="395" y="214" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#44546a">20/1977</text>
  <text x="545" y="145" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#b45309">15-JUN-1977</text>
  <text x="545" y="198" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#44546a">Primeras elecciones</text>
  <text x="695" y="145" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#173a5e">1978</text>
  <text x="695" y="198" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#44546a">Constitución:</text>
  <text x="695" y="214" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#44546a">provincia y proporción</text>
  <text x="875" y="145" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#173a5e">1985</text>
  <text x="875" y="198" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#44546a">LOREG</text>
  <text x="875" y="214" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#44546a">consolida el modelo</text>
  <text x="44" y="276" font-family="system-ui, sans-serif" font-size="13" fill="#5f6f85">La fórmula D'Hondt no está en la Constitución: es una decisión de la legislación electoral.</text>
</svg>
