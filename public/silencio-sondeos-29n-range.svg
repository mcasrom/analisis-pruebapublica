    <text x="40" y="224">SUMAR</text><line x1="180" y1="220" x2="226" y2="220" stroke="#9b4d6b" stroke-width="9" stroke-linecap="round" opacity=".28"/><circle cx="200" cy="220" r="7" fill="#9b4d6b"/><text x="244" y="225" font-size="11" fill="#667085">5,3–9,2 · media 6,7</text>
