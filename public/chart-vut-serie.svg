<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t d">
  <title id="t">Viviendas turísticas en España según el INE</title>
  <desc id="d">Agosto 2021: 403.267. Mayo 2025: 381.837. Noviembre 2025: 329.764. Mayo 2026: 341.001.</desc>
  <rect width="720" height="400" fill="#fcfcfb"/>
  <text x="32" y="38" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#0b0b0b">Viviendas turísticas en España (INE)</text>
  <text x="32" y="60" font-family="system-ui,sans-serif" font-size="13" fill="#52514e">Anuncios en plataformas, estadística experimental. Eje en miles de viviendas.</text>
  <g stroke="#e4e3df" stroke-width="1">
    <line x1="60" y1="300" x2="690" y2="300" stroke="#9a998f"/>
    <line x1="60" y1="225" x2="690" y2="225"/>
    <line x1="60" y1="150" x2="690" y2="150"/>
    <line x1="60" y1="75" x2="690" y2="75"/>
  </g>
  <g font-family="system-ui,sans-serif" font-size="12" fill="#52514e" text-anchor="end">
    <text x="52" y="304">0</text><text x="52" y="229">150</text><text x="52" y="154">300</text><text x="52" y="79">450</text>
  </g>
  <!-- escala: 1 px = 2 mil viviendas (150 mil = 75 px) -->
  <g fill="#2a78d6">
    <path d="M100 98.4 h100 v201.6 h-100 z"/>
    <path d="M240 109 h100 v191 h-100 z"/>
    <path d="M380 135 h100 v165 h-100 z"/>
    <path d="M520 129.5 h100 v170.5 h-100 z"/>
  </g>
  <g font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">
    <text x="150" y="90">403.267</text><text x="290" y="101">381.837</text>
    <text x="430" y="127">329.764</text><text x="570" y="121">341.001</text>
  </g>
  <g font-family="system-ui,sans-serif" font-size="13" fill="#52514e" text-anchor="middle">
    <text x="150" y="322">Ago 2021</text><text x="290" y="322">May 2025</text>
    <text x="430" y="322">Nov 2025</text><text x="570" y="322">May 2026</text>
    <text x="150" y="340" font-size="11">máximo histórico</text>
    <text x="570" y="340" font-size="11">−10,7 % interanual · +3,4 % vs nov</text>
  </g>
  <text x="32" y="382" font-family="system-ui,sans-serif" font-size="11" fill="#52514e">Gráfico: Análisis | analisis.pruebapublica.com. Fuente: INE. Elaboración propia.</text>
</svg>
