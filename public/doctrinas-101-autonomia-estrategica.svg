<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" role="img" aria-label="Los cuatro criterios aplicados a la autonomía estratégica europea">
<rect width="680" height="430" fill="#f8fafc"/>
<text x="340" y="34" text-anchor="middle" font-family="Georgia,serif" font-size="20" font-weight="bold" fill="#0f172a">¿Doctrina o aspiración?</text>
<text x="340" y="56" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">Autonomía estratégica de la UE · los cuatro criterios</text>
<g font-family="sans-serif">
<rect x="40" y="90" width="600" height="62" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
<text x="60" y="118" font-size="14" font-weight="bold" fill="#78350f">1 · Institucionalizada, no personal</text>
<text x="60" y="140" font-size="12" fill="#78350f">Parcial — reglamentos (SAFE, EDIP, MPF), pero sin mando ni doctrina de la fuerza</text>

<rect x="40" y="160" width="600" height="62" rx="8" fill="#dcfce7" stroke="#22c55e"/>
<text x="60" y="188" font-size="14" font-weight="bold" fill="#14532d">2 · Repetida, no episódica</text>
<text x="60" y="210" font-size="12" fill="#14532d">Alta — 2016 · 2022 · 2025 · 2026</text>

<rect x="40" y="230" width="600" height="62" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
<text x="60" y="258" font-size="14" font-weight="bold" fill="#1e3a8a">3 · Documentable con fuente primaria</text>
<text x="60" y="280" font-size="12" fill="#1e3a8a">Muy alta — Consejo, Comisión y reglamentos con importes y plazos</text>

<rect x="40" y="300" width="600" height="62" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="60" y="328" font-size="14" font-weight="bold" fill="#334155">4 · Distinguible de la reacción coyuntural</text>
<text x="60" y="350" font-size="12" fill="#334155">Lo dirá el tiempo — financiación temporal (EDIP 2025-2027; flexibilidad 4 años)</text>
</g>
<text x="340" y="398" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">Dos cumplimientos claros · uno parcial · uno abierto</text>
<text x="340" y="418" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">Instrumento propio de la serie Doctrinas 101 · no es categoría oficial</text>
</svg>
