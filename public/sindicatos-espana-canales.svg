<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-label="sindicatos-espana-canales.svg"><rect width="960" height="430" fill="#f7f4ec"/><text x="52" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1f2933" text-anchor="start">Los canales de influencia sindical</text><text x="52" y="86" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" fill="#5f6b76" text-anchor="start">Influencia institucional no es poder político directo.</text><rect x="365" y="175" width="230" height="60" rx="8" fill="#12171d"/><text x="480" y="212" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">SINDICATOS</text><rect x="25" y="140" width="310" height="52" rx="6" fill="#ffffff"/><rect x="25" y="140" width="310" height="52" rx="6" fill="none" stroke="#d8d1c2"/><text x="180" y="173" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="middle">Negociación colectiva</text><rect x="625" y="140" width="310" height="52" rx="6" fill="#ffffff"/><rect x="625" y="140" width="310" height="52" rx="6" fill="none" stroke="#d8d1c2"/><text x="780" y="173" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="middle">Diálogo social</text><rect x="25" y="300" width="310" height="52" rx="6" fill="#ffffff"/><rect x="25" y="300" width="310" height="52" rx="6" fill="none" stroke="#d8d1c2"/><text x="180" y="333" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="middle">Representación institucional</text><rect x="625" y="300" width="310" height="52" rx="6" fill="#ffffff"/><rect x="625" y="300" width="310" height="52" rx="6" fill="none" stroke="#d8d1c2"/><text x="780" y="333" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="middle">Movilización</text><line x1="335" y1="166" x2="365" y2="195" stroke="#1f8a78" stroke-width="3"/><line x1="625" y1="166" x2="595" y2="195" stroke="#1f8a78" stroke-width="3"/><line x1="335" y1="326" x2="365" y2="215" stroke="#1f8a78" stroke-width="3"/><line x1="625" y1="326" x2="595" y2="215" stroke="#1f8a78" stroke-width="3"/><text x="52" y="405" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" fill="#5f6b76" text-anchor="start">Fuente: elaboración propia a partir de la LOLS y la práctica de negociación y diálogo social.</text></svg>