<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 390" role="img" aria-labelledby="t d" class="chart"><title id="t">Lluvia y participación: desviación intra-elección</title><desc id="d">Con más de 5 mm de precipitación media, la participación se sitúa 2,02 puntos por debajo de la media de su elección. Es una asociación observacional, no una relación causal.</desc><rect width="940" height="390" fill="#ffffff"/><style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace} .axis{stroke:#cbd5e1;stroke-width:1} .grid{stroke:#e2e8f0;stroke-width:1} .lab{fill:#334155;font-size:13px} .small{fill:#64748b;font-size:11px} .big{fill:#0f172a;font-size:20px;font-weight:700}</style><text x="70" y="30" class="big">Lluvia y participación: desviación intra-elección</text><text x="70" y="48" class="small">Puntos porcentuales respecto a la media de cada elección · 806 observaciones provincia × elección</text><line x1="70" y1="64.0" x2="910" y2="64.0" class="grid"/><text x="60" y="68.0" text-anchor="end" class="small">+1 pp</text><line x1="70" y1="136.6" x2="910" y2="136.6" class="grid"/><text x="60" y="140.6" text-anchor="end" class="small">+0 pp</text><line x1="70" y1="209.1" x2="910" y2="209.1" class="grid"/><text x="60" y="213.1" text-anchor="end" class="small">-1 pp</text><line x1="70" y1="281.7" x2="910" y2="281.7" class="grid"/><text x="60" y="285.7" text-anchor="end" class="small">-2 pp</text><line x1="70" y1="136.6" x2="910" y2="136.6" stroke="#64748b" stroke-width="1.5"/><rect x="150.0" y="106.8" width="110" height="29.8" fill="#0f766e" opacity=".9"><title>0 mm: +0.41 pp · n=490</title></rect><text x="205.0" y="98.8" text-anchor="middle" class="small" font-weight="700">+0.41 pp</text><text x="205.0" y="356" text-anchor="middle" class="lab">0 mm</text><text x="205.0" y="373" text-anchor="middle" class="small">n=490</text><rect x="340.0" y="136.6" width="110" height="27.6" fill="#f97316" opacity=".9"><title>0–1 mm: -0.38 pp · n=175</title></rect><text x="395.0" y="182.1" text-anchor="middle" class="small" font-weight="700">-0.38 pp</text><text x="395.0" y="356" text-anchor="middle" class="lab">0–1 mm</text><text x="395.0" y="373" text-anchor="middle" class="small">n=175</text><rect x="530.0" y="136.6" width="110" height="13.1" fill="#f97316" opacity=".9"><title>1–5 mm: -0.18 pp · n=81</title></rect><text x="585.0" y="167.6" text-anchor="middle" class="small" font-weight="700">-0.18 pp</text><text x="585.0" y="356" text-anchor="middle" class="lab">1–5 mm</text><text x="585.0" y="373" text-anchor="middle" class="small">n=81</text><rect x="720.0" y="136.6" width="110" height="146.6" fill="#f97316" opacity=".9"><title>>5 mm: -2.02 pp · n=60</title></rect><text x="775.0" y="301.2" text-anchor="middle" class="small" font-weight="700">-2.02 pp</text><text x="775.0" y="356" text-anchor="middle" class="lab">>5 mm</text><text x="775.0" y="373" text-anchor="middle" class="small">n=60</text><text x="70" y="388" class="small">Asociación observacional, no causalidad · M5, 16 elecciones y 52 provincias</text></svg>