<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Tres capas de una protesta conectada</title>
  <desc id="desc">Contagio social, imitación organizativa y coordinación operativa exigen niveles distintos de prueba.</desc>
  <rect width="1000" height="360" fill="#f8fafc"/>
  <text x="40" y="48" font-family="system-ui, sans-serif" font-size="23" font-weight="800" fill="#0f172a">Tres capas, tres exigencias de prueba</text>
  <text x="40" y="74" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">Una misma imagen puede circular sin que exista un mando común.</text>

  <g font-family="system-ui, sans-serif">
    <rect x="40" y="112" width="280" height="176" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
    <text x="64" y="148" font-size="17" font-weight="800" fill="#b45309">1 · Contagio social</text>
    <text x="64" y="176" font-size="12.5" fill="#334155">Símbolos, imágenes y consignas</text>
    <text x="64" y="196" font-size="12.5" fill="#334155">que se reconocen fuera de su país.</text>
    <rect x="64" y="226" width="150" height="28" rx="14" fill="#fef3c7"/>
    <text x="78" y="245" font-size="11.5" font-weight="700" fill="#92400e">Fácil de observar</text>
    <text x="64" y="272" font-size="11.5" fill="#64748b">No prueba dirección común.</text>

    <rect x="360" y="112" width="280" height="176" rx="12" fill="#ffffff" stroke="#f97316" stroke-width="3"/>
    <text x="384" y="148" font-size="17" font-weight="800" fill="#c2410c">2 · Imitación organizativa</text>
    <text x="384" y="176" font-size="12.5" fill="#334155">TikTok, QR, grupos privados</text>
    <text x="384" y="196" font-size="12.5" fill="#334155">y una estética que se copia.</text>
    <rect x="384" y="226" width="150" height="28" rx="14" fill="#ffedd5"/>
    <text x="398" y="245" font-size="11.5" font-weight="700" fill="#9a3412">Requiere reconstruir</text>
    <text x="384" y="272" font-size="11.5" fill="#64748b">No prueba un mando común.</text>

    <rect x="680" y="112" width="280" height="176" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
    <text x="704" y="148" font-size="17" font-weight="800" fill="#b91c1c">3 · Coordinación operativa</text>
    <text x="704" y="176" font-size="12.5" fill="#334155">Comunicaciones, instrucciones,</text>
    <text x="704" y="196" font-size="12.5" fill="#334155">financiación y responsables.</text>
    <rect x="704" y="226" width="180" height="28" rx="14" fill="#fee2e2"/>
    <text x="718" y="245" font-size="11.5" font-weight="700" fill="#991b1b">Exige pruebas específicas</text>
    <text x="704" y="272" font-size="11.5" fill="#64748b">Es la capa que falta acreditar.</text>
  </g>

  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="320" y1="200" x2="354" y2="200"/>
    <line x1="640" y1="200" x2="674" y2="200"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <text x="40" y="330" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Elaboración propia. Una cosa es que un repertorio circule; otra que exista una organización que lo dirija.</text>
</svg>
