<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-label="Las tres pruebas de la legitimidad">
<rect width="1000" height="320" fill="#0f172a"/>
<text x="50" y="45" fill="#f97316" font-family="sans-serif" font-size="18" font-weight="700">TRES PRUEBAS DE LEGITIMIDAD</text>
<g font-family="sans-serif" text-anchor="middle">
<circle cx="190" cy="155" r="78" fill="#111b2e" stroke="#38bdf8" stroke-width="2"/><text x="190" y="145" fill="#fff" font-size="20" font-weight="700">Origen</text><text x="190" y="172" fill="#94a3b8" font-size="14">aceptar reglas</text>
<circle cx="500" cy="155" r="78" fill="#111b2e" stroke="#f97316" stroke-width="2"/><text x="500" y="145" fill="#fff" font-size="20" font-weight="700">Ejercicio</text><text x="500" y="172" fill="#94a3b8" font-size="14">límites y control</text>
<circle cx="810" cy="155" r="78" fill="#111b2e" stroke="#22c55e" stroke-width="2"/><text x="810" y="145" fill="#fff" font-size="20" font-weight="700">Salida</text><text x="810" y="172" fill="#94a3b8" font-size="14">aceptar perder</text>
<path d="M268 155 H420" stroke="#475569" stroke-width="2" stroke-dasharray="5 5"/><path d="M580 155 H732" stroke="#475569" stroke-width="2" stroke-dasharray="5 5"/>
<text x="500" y="285" fill="#94a3b8" font-size="15">Ninguna prueba sustituye a las otras. La democracia se mide en las tres.</text>
</g></svg>
