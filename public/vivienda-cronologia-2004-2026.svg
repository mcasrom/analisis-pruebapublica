<text x='40' y='923' font-size='13' font-style='italic' fill='#94a3b8'>Las cifras de producción usan la definición estadística de la serie oficial (calificaciones</text>
<text x='40' y='941' font-size='13' font-style='italic' fill='#94a3b8'>definitivas). Los hitos de 2025–2026 distinguen anuncios de resultados en seguimiento.</text>
