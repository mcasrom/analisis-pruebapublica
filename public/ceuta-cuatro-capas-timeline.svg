<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img" aria-labelledby="t d"><title id="t">Línea temporal de Ceuta: 1415, 1668, 1986 y 2026</title><desc id="d">Hitos seleccionados: 1415, 1668, 1986 y 2026. No se presentan como una secuencia causal.</desc><rect width="940" height="330" fill="#fff"/><style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style><text x="24" y="34" font-size="24" font-weight="800" fill="#0f172a">Cuatro fechas, no una frontera natural</text><text x="24" y="56" font-size="12" fill="#64748b">Hitos documentados en el archivo; no sustituyen un tratado por una interpretación.</text><line x1="90" y1="205" x2="850" y2="205" stroke="#cbd5e1" stroke-width="3"/><circle cx="90" cy="205" r="10" fill="#fff" stroke="#0f766e" stroke-width="4"/><text x="90" y="178" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a">1415</text><text x="90" y="238" text-anchor="middle" font-size="12" fill="#334155">Corona portuguesa</text><circle cx="310" cy="205" r="10" fill="#fff" stroke="#0f766e" stroke-width="4"/><text x="310" y="178" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a">1668</text><text x="310" y="238" text-anchor="middle" font-size="12" fill="#334155">Tratado de Lisboa</text><circle cx="530" cy="205" r="10" fill="#fff" stroke="#0f766e" stroke-width="4"/><text x="530" y="178" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a">1986</text><text x="530" y="238" text-anchor="middle" font-size="12" fill="#334155">Adhesión a las CE</text><circle cx="750" cy="205" r="10" fill="#fff" stroke="#0f766e" stroke-width="4"/><text x="750" y="178" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a">2026</text><text x="750" y="238" text-anchor="middle" font-size="12" fill="#334155">Crisis del 30J</text><text x="24" y="310" font-size="10.5" fill="#64748b">Fuentes: CEUTA Watch · Historia; Tratado de Adhesión de España a las CE. No se usan aquí los tratados de 1767–1860 sin cotejo.</text></svg>