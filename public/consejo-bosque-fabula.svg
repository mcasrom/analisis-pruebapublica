<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="cb-title cb-desc">
  <title id="cb-title">El consejo del bosque y la bolsa vacía</title>
  <desc id="cb-desc">Los animales del bosque reunidos alrededor de una mesa de piedra; en el centro, el búho custodia un libro de cuentas abierto con una bolsa vacía.</desc>
  <defs>
    <linearGradient id="bosque" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#16302a"/>
      <stop offset="1" stop-color="#0b1512"/>
    </linearGradient>
    <radialGradient id="luz" cx="0.5" cy="0.28" r="0.6">
      <stop offset="0" stop-color="#f4b942" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f4b942" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bosque)"/>
  <rect width="1200" height="630" fill="url(#luz)"/>

  <!-- Luna -->
  <circle cx="980" cy="120" r="52" fill="#e8edf5" opacity="0.9"/>
  <circle cx="962" cy="106" r="52" fill="#0f172a" opacity="0.55"/>

  <!-- Árboles de fondo -->
  <g fill="#0a1a14" opacity="0.9">
    <path d="M90 470 L150 250 L210 470 Z"/><rect x="143" y="430" width="14" height="70"/>
    <path d="M1010 470 L1064 300 L1118 470 Z"/><rect x="1057" y="440" width="14" height="60"/>
    <path d="M1130 470 L1168 350 L1206 470 Z"/>
    <path d="M20 470 L58 350 L96 470 Z"/>
  </g>

  <!-- Suelo -->
  <path d="M0 470 H1200 V630 H0 Z" fill="#0b1512"/>
  <path d="M0 470 q300 26 600 8 q300 -18 600 8 V630 H0 Z" fill="#102019"/>

  <!-- Mesa de piedra -->
  <ellipse cx="600" cy="452" rx="330" ry="86" fill="#3a4653"/>
  <ellipse cx="600" cy="442" rx="330" ry="86" fill="#4d5b6b"/>
  <ellipse cx="600" cy="440" rx="300" ry="72" fill="#586779"/>

  <!-- Libro de cuentas abierto, con brillo -->
  <g>
    <path d="M470 452 L600 430 L730 452 L600 476 Z" fill="#f3ede0"/>
    <path d="M470 452 Q535 438 600 430 L600 476 Q535 470 470 462 Z" fill="#fffaf0"/>
    <path d="M730 452 Q665 438 600 430 L600 476 Q665 470 730 462 Z" fill="#fbf6ea"/>
    <g stroke="#c9b587" stroke-width="3">
      <line x1="500" y1="452" x2="560" y2="444"/>
      <line x1="500" y1="458" x2="560" y2="450"/>
      <line x1="640" y1="444" x2="700" y2="452"/>
      <line x1="640" y1="450" x2="700" y2="458"/>
    </g>
    <line x1="600" y1="430" x2="600" y2="476" stroke="#d9c8a0" stroke-width="3"/>
  </g>

  <!-- Moneda y bolsa vacía -->
  <g>
    <circle cx="600" cy="406" r="20" fill="#f4b942"/>
    <circle cx="600" cy="406" r="20" fill="none" stroke="#b9861f" stroke-width="3"/>
    <text x="600" y="413" font-family="DejaVu Serif, serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#6b4d12">€</text>
    <path d="M540 432 q60 -20 120 0 q-14 30 -60 30 q-46 0 -60 -30 Z" fill="#7a5a2e" opacity="0.85"/>
  </g>

  <!-- Asientos / siluetas alrededor de la mesa -->
  <!-- León (centro-izquierda) -->
  <g transform="translate(250,300)">
    <circle cx="0" cy="0" r="52" fill="#8a5a2b"/>
    <circle cx="0" cy="0" r="40" fill="#b47a3c"/>
    <circle cx="-14" cy="-6" r="5" fill="#3a2410"/><circle cx="14" cy="-6" r="5" fill="#3a2410"/>
    <path d="M-14 12 q14 12 28 0" stroke="#3a2410" stroke-width="4" fill="none"/>
  </g>
  <!-- Zorro (izquierda) -->
  <g transform="translate(120,360)">
    <path d="M0 0 L-30 -50 L-6 -34 Z" fill="#c8742a"/><path d="M0 0 L30 -50 L6 -34 Z" fill="#c8742a"/>
    <circle cx="0" cy="14" r="40" fill="#d98a3d"/>
    <circle cx="-13" cy="8" r="5" fill="#3a2410"/><circle cx="13" cy="8" r="5" fill="#3a2410"/>
    <circle cx="0" cy="26" r="6" fill="#3a2410"/>
  </g>
  <!-- Cierva (izquierda-extrema) -->
  <g transform="translate(60,300)">
    <path d="M-10 -30 l-26 -34 M-16 -40 l-24 -18 M-16 -40 l-30 -6" stroke="#8a6a44" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M18 -30 l26 -34 M24 -40 l24 -18 M24 -40 l30 -6" stroke="#8a6a44" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="4" cy="12" r="34" fill="#c79a63"/>
    <circle cx="-8" cy="8" r="5" fill="#3a2410"/><circle cx="14" cy="8" r="5" fill="#3a2410"/>
  </g>
  <!-- Halcón (derecha) -->
  <g transform="translate(480,250)">
    <path d="M0 0 q-70 -30 -96 6 q40 22 84 22 Z" fill="#6b7686"/>
    <path d="M0 0 q70 -30 96 6 q-40 22 -84 22 Z" fill="#6b7686"/>
    <circle cx="0" cy="6" r="30" fill="#8b96a6"/>
    <path d="M-10 2 L16 2 L2 20 Z" fill="#f4b942"/>
    <circle cx="-10" cy="-6" r="4" fill="#1a1f28"/><circle cx="10" cy="-6" r="4" fill="#1a1f28"/>
  </g>
  <!-- Castor (derecha) -->
  <g transform="translate(720,360)">
    <ellipse cx="52" cy="30" rx="46" ry="18" fill="#5a4632"/>
    <circle cx="0" cy="10" r="40" fill="#7a5f44"/>
    <circle cx="-13" cy="4" r="5" fill="#26180c"/><circle cx="13" cy="4" r="5" fill="#26180c"/>
    <rect x="-10" y="24" width="20" height="12" rx="3" fill="#f3ede0"/>
  </g>

  <!-- Búho custodio (centro, sobre el libro) -->
  <g transform="translate(600,232)">
    <circle cx="0" cy="0" r="44" fill="#6b7686"/>
    <circle cx="-17" cy="-6" r="16" fill="#f3ede0"/><circle cx="17" cy="-6" r="16" fill="#f3ede0"/>
    <circle cx="-17" cy="-6" r="7" fill="#f4b942"/><circle cx="17" cy="-6" r="7" fill="#f4b942"/>
    <path d="M-10 20 L0 34 L10 20" fill="#f4b942"/>
    <path d="M-30 -34 l-10 -20 l24 10 Z" fill="#8b96a6"/>
    <path d="M30 -34 l10 -20 l-24 10 Z" fill="#8b96a6"/>
  </g>

  <!-- Pie -->
  <g fill="#f4b942" opacity="0.95">
    <rect x="0" y="0" width="1200" height="10"/>
  </g>
</svg>
