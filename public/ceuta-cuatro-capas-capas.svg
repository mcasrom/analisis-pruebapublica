<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" role="img" aria-labelledby="t d"><title id="t">Las cuatro capas de Ceuta</title><desc id="d">Esquema de cuatro capas: geografía, historia, economía y geopolítica. No es una cadena causal.</desc><rect width="940" height="520" fill="#fff"/><style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style><text x="24" y="34" font-size="24" font-weight="800" fill="#0f172a">Cuatro capas para leer Ceuta</text><text x="24" y="56" font-size="12" fill="#64748b">No son cuatro explicaciones separadas: son planos que se cruzan.</text><rect x="24" y="88" width="892" height="82" rx="10" fill="#0f766e" opacity=".09" stroke="#0f766e" stroke-width="1.5"/><text x="46" y="118" font-size="12" class="m" font-weight="700" fill="#0f766e">01</text><text x="82" y="120" font-size="18" font-weight="800" fill="#0f172a">GEOGRAFÍA</text><text x="82" y="145" font-size="13" fill="#334155">Estrecho, doble fachada, dependencia marítima</text><rect x="24" y="192" width="892" height="82" rx="10" fill="#b45309" opacity=".09" stroke="#b45309" stroke-width="1.5"/><text x="46" y="222" font-size="12" class="m" font-weight="700" fill="#b45309">02</text><text x="82" y="224" font-size="18" font-weight="800" fill="#0f172a">HISTORIA</text><text x="82" y="249" font-size="13" fill="#334155">1415 · 1668 · 1986: capas jurídicas</text><rect x="24" y="296" width="892" height="82" rx="10" fill="#7c3aed" opacity=".09" stroke="#7c3aed" stroke-width="1.5"/><text x="46" y="326" font-size="12" class="m" font-weight="700" fill="#7c3aed">03</text><text x="82" y="328" font-size="18" font-weight="800" fill="#0f172a">ECONOMÍA</text><text x="82" y="353" font-size="13" fill="#334155">IPSI, porteo, puerto, extrapeninsularidad</text><rect x="24" y="400" width="892" height="82" rx="10" fill="#1d4ed8" opacity=".09" stroke="#1d4ed8" stroke-width="1.5"/><text x="46" y="430" font-size="12" class="m" font-weight="700" fill="#1d4ed8">04</text><text x="82" y="432" font-size="18" font-weight="800" fill="#0f172a">GEOPOLÍTICA</text><text x="82" y="457" font-size="13" fill="#334155">España, Marruecos, Argelia, UE, aliados</text><text x="24" y="508" font-size="10.5" fill="#64748b">Esquema propio · no es una cadena causal ni una predicción.</text></svg>