    <g fill="#38bdf8" opacity="0.85">
      <rect x="126" y="164" width="44" height="4" rx="2"/><rect x="126" y="176" width="30" height="4" rx="2"/><rect x="126" y="188" width="38" height="4" rx="2"/>
      <rect x="202" y="164" width="44" height="4" rx="2"/><rect x="202" y="176" width="28" height="4" rx="2"/><rect x="202" y="188" width="36" height="4" rx="2"/>
      <rect x="278" y="164" width="44" height="4" rx="2"/><rect x="278" y="176" width="31" height="4" rx="2"/><rect x="278" y="188" width="40" height="4" rx="2"/>
      <rect x="126" y="298" width="44" height="4" rx="2"/><rect x="126" y="310" width="27" height="4" rx="2"/><rect x="126" y="322" width="35" height="4" rx="2"/>
      <rect x="202" y="298" width="44" height="4" rx="2"/><rect x="202" y="310" width="32" height="4" rx="2"/><rect x="202" y="322" width="40" height="4" rx="2"/>
      <rect x="278" y="298" width="44" height="4" rx="2"/><rect x="278" y="310" width="26" height="4" rx="2"/><rect x="278" y="322" width="34" height="4" rx="2"/>
    </g>
    <g fill="#f97316" opacity="0.8">
      <circle cx="116" cy="360" r="3"/><circle cx="132" cy="360" r="3"/><circle cx="148" cy="360" r="3"/>
    </g>
    <!-- base -->
    <path d="M90 434 L360 434 L390 462 L120 462 Z" fill="#0a1424" stroke="#1e40af" stroke-opacity="0.5"/>
  </g>

  <!-- TORRE ELÉCTRICA -->
  <g transform="translate(665 275)" fill="none" stroke="#f97316" stroke-width="5" stroke-linecap="round" opacity="0.9">
    <path d="M30 430 L103 30 L176 430"/>
    <path d="M53 330 H153"/><path d="M44 260 H162"/><path d="M36 190 H170"/>
    <path d="M103 30 L53 330 M103 30 L153 330"/>
    <path d="M68 330 L103 30 M138 330 L103 30"/>
