      </g>
      <g fill="#7dd3fc">
        <rect x="-6" y="28" width="6" height="18" rx="2"/><rect x="-6" y="58" width="6" height="18" rx="2"/><rect x="-6" y="88" width="6" height="18" rx="2"/>
        <rect x="150" y="28" width="6" height="18" rx="2"/><rect x="150" y="58" width="6" height="18" rx="2"/><rect x="150" y="88" width="6" height="18" rx="2"/>
        <rect x="28" y="-6" width="18" height="6" rx="2"/><rect x="58" y="-6" width="18" height="6" rx="2"/><rect x="88" y="-6" width="18" height="6" rx="2"/>
        <rect x="28" y="150" width="18" height="6" rx="2"/><rect x="58" y="150" width="18" height="6" rx="2"/><rect x="88" y="150" width="18" height="6" rx="2"/>
