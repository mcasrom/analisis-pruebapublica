  <text x="72" y="76" fill="#f97316" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="14" font-weight="700" letter-spacing="5">INFRAESTRUCTURA DEL PODER</text>
  <text x="72" y="112" fill="#94a3b8" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13" letter-spacing="2">ENERGÍA · CHIPS · CENTROS DE DATOS · REDES</text>
</svg>
