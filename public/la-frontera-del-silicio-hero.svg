    <circle cx="0" cy="0" r="210" fill="#0a1a2f" fill-opacity="0.52" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.75"/>
    <g fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5">
