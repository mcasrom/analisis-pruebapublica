<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111c31"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#38bdf8" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orangeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16263f"/>
      <stop offset="1" stop-color="#0b1628"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3552"/>
      <stop offset="1" stop-color="#0c1a2d"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#075985"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#94a3b8" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1190" cy="390" r="390" fill="url(#glow)"/>
  <circle cx="470" cy="440" r="330" fill="url(#orangeGlow)"/>

  <!-- líneas de horizonte / corriente -->
  <g fill="none" stroke="#334155" stroke-width="1" opacity="0.7">
    <path d="M0 748 H1600"/>
    <path d="M0 752 H1600"/>
    <path d="M0 760 H1600" stroke-dasharray="3 9"/>
  </g>

  <!-- datos / flujos de fondo -->
  <g fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.22">
    <path d="M90 280 C330 120 630 120 780 260 S1110 420 1510 240"/>
    <path d="M70 620 C360 780 690 770 860 610 S1190 470 1530 610"/>
    <path d="M300 180 C380 330 350 570 330 760"/>
  </g>

  <!-- CENTRO DE DATOS -->
  <g transform="translate(118 318)">
    <!-- techo / perspectiva -->
    <path d="M0 72 L270 0 L360 32 L360 84 L90 154 L0 122 Z" fill="#0c1a2d" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="2"/>
    <path d="M270 0 L360 32 L360 84 L270 52 Z" fill="#1b3557" opacity="0.85"/>
    <path d="M0 72 L90 104 L90 156 L0 122 Z" fill="#142844"/>

    <!-- frontal principal -->
    <rect x="90" y="104" width="270" height="330" rx="6" fill="url(#rack)" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="2"/>
    <rect x="90" y="104" width="270" height="12" fill="#f97316" opacity="0.95"/>
    <rect x="104" y="132" width="242" height="282" rx="4" fill="#071321" stroke="#1e40af" stroke-opacity="0.55"/>

