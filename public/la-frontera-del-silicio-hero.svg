      <rect x="34" y="42" width="42" height="7" rx="3" fill="#f97316"/><rect x="34" y="62" width="60" height="7" rx="3" fill="#38bdf8"/><rect x="34" y="82" width="48" height="7" rx="3" fill="#38bdf8"/>
