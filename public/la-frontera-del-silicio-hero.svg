  <!-- conexiones centro de datos ↔ chips ↔ red -->
  <g fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-dasharray="7 7" opacity="0.55">
    <path d="M490 470 C650 470 760 470 900 470"/>
    <path d="M1055 470 C1140 470 1200 440 1275 420"/>
  </g>

  <!-- etiquetas inferiores -->
  <g font-family="DejaVu Sans, Liberation Sans, sans-serif" fill="#cbd5e1">
    <g font-size="13" letter-spacing="3">
      <text x="150" y="812">ENERGÍA</text>
      <text x="660" y="812">CHIPS</text>
      <text x="986" y="812">CÓMPUTO</text>
      <text x="1280" y="812">REDES</text>
