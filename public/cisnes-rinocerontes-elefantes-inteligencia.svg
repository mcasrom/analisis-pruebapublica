<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="cisnes-rinocerontes-elefantes-inteligencia.svg"><rect width="960" height="400" fill="#f7f3e8"/><text x="48" y="50" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17202a" text-anchor="start">Observar, interpretar, decidir</text><text x="48" y="82" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" fill="#5e6a75" text-anchor="start">Tres niveles que pueden fallar por separado</text><rect x="55" y="140" width="250" height="130" rx="10" fill="#ffffff" stroke="#d9d2c3" stroke-width="2"/><rect x="55" y="140" width="250" height="7" rx="10" fill="#7aa7d8"/><text x="73" y="178" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#17202a" text-anchor="start">OBSERVACIÓN</text><text x="73" y="215" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5e6a75" text-anchor="start">Datos, señales y movimientos</text><text x="315" y="210" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" fill="#e85d2a" text-anchor="start">→</text><rect x="355" y="140" width="250" height="130" rx="10" fill="#ffffff" stroke="#d9d2c3" stroke-width="2"/><rect x="355" y="140" width="250" height="7" rx="10" fill="#ffb020"/><text x="373" y="178" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#17202a" text-anchor="start">INTERPRETACIÓN</text><text x="373" y="215" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5e6a75" text-anchor="start">Qué significan y qué escenarios abren</text><text x="615" y="210" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" fill="#e85d2a" text-anchor="start">→</text><rect x="655" y="140" width="250" height="130" rx="10" fill="#ffffff" stroke="#d9d2c3" stroke-width="2"/><rect x="655" y="140" width="250" height="7" rx="10" fill="#2d9b84"/><text x="673" y="178" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#17202a" text-anchor="start">DECISIÓN</text><text x="673" y="215" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5e6a75" text-anchor="start">Qué se hace con el conocimiento</text><rect x="55" y="310" width="845" height="50" rx="8" fill="#fff7e4" stroke="#ead59b" stroke-width="2"/><text x="75" y="342" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" fill="#17202a" text-anchor="start">Puede fallar la observación, la interpretación o la decisión. No es un único fallo.</text><text x="48" y="392" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" fill="#5e6a75" text-anchor="start">Elaboración propia.</text></svg>