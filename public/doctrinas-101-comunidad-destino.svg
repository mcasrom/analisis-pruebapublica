<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" aria-label="Esquema de la doctrina china: cuatro iniciativas convergen en la comunidad de destino compartido">
<rect width="680" height="420" fill="#f8fafc"/>
<text x="340" y="36" text-anchor="middle" font-family="Georgia,serif" font-size="20" font-weight="bold" fill="#0f172a">Comunidad de destino compartido</text>
<text x="340" y="58" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">人类命运共同体 · marco doctrinal chino desde 2013</text>
<g font-family="sans-serif" font-size="13" font-weight="bold">
<rect x="30" y="110" width="140" height="70" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
<text x="100" y="138" text-anchor="middle" fill="#1e3a8a">Desarrollo</text><text x="100" y="158" text-anchor="middle" fill="#1e3a8a">2021</text>
<rect x="190" y="110" width="140" height="70" rx="8" fill="#fee2e2" stroke="#ef4444"/>
<text x="260" y="138" text-anchor="middle" fill="#7f1d1d">Seguridad</text><text x="260" y="158" text-anchor="middle" fill="#7f1d1d">2022</text>
<rect x="350" y="110" width="140" height="70" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
<text x="420" y="138" text-anchor="middle" fill="#78350f">Civilización</text><text x="420" y="158" text-anchor="middle" fill="#78350f">2023</text>
<rect x="510" y="110" width="140" height="70" rx="8" fill="#dcfce7" stroke="#22c55e"/>
<text x="580" y="138" text-anchor="middle" fill="#14532d">Gobernanza</text><text x="580" y="158" text-anchor="middle" fill="#14532d">2025</text>
</g>
<g stroke="#94a3b8" stroke-width="1.5">
<line x1="100" y1="180" x2="290" y2="250"/><line x1="260" y1="180" x2="310" y2="250"/>
<line x1="420" y1="180" x2="370" y2="250"/><line x1="580" y1="180" x2="390" y2="250"/>
</g>
<ellipse cx="340" cy="290" rx="150" ry="48" fill="#0f172a"/>
<text x="340" y="284" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff">Orden alternativo</text>
<text x="340" y="306" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cbd5e1">Sur Global · ONU en el centro</text>
<line x1="340" y1="338" x2="340" y2="368" stroke="#94a3b8" stroke-width="1.5"/>
<text x="340" y="392" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">Prueba: el Indo-Pacífico (lenguaje vs. hechos)</text>
