<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-label="Mecanismo de propagación en cinco pasos con bucle de realimentación">
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .n { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .b { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .t { font-size: 12px; fill: #334155; }
    .h { font-size: 18px; font-weight: 700; fill: #0f172a; }
    .s { font-size: 12px; fill: #475569; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1000" height="340" rx="12" fill="#f8fafc"/>
  <text x="24" y="34" class="h">Cinco piezas: cómo se propaga una protesta</text>

  <g>
    <rect x="24" y="64" width="172" height="150" rx="10" fill="#e0f2fe" stroke="#0ea5e9"/>
    <circle cx="44" cy="84" r="12" fill="#0ea5e9"/><text x="44" y="89" class="n" text-anchor="middle">1</text>
    <text x="62" y="89" class="b">Malestar</text>
    <text x="38" y="116" class="t">Desigualdad de clase</text>
    <text x="38" y="134" class="t">y de generación:</text>
    <text x="38" y="152" class="t">vivienda, escuela,</text>
    <text x="38" y="170" class="t">empleo, clima</text>
  </g>
  <g>
    <rect x="216" y="64" width="172" height="150" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
    <circle cx="236" cy="84" r="12" fill="#f59e0b"/><text x="236" y="89" class="n" text-anchor="middle">2</text>
    <text x="254" y="89" class="b">Detonante</text>
    <text x="230" y="116" class="t">Algo concreto y</text>
    <text x="230" y="134" class="t">contable en vídeo:</text>
    <text x="230" y="152" class="t">una prohibición,</text>
    <text x="230" y="170" class="t">un recorte, un caso</text>
  </g>
  <g>
    <rect x="408" y="64" width="172" height="150" rx="10" fill="#ede9fe" stroke="#8b5cf6"/>
    <circle cx="428" cy="84" r="12" fill="#8b5cf6"/><text x="428" y="89" class="n" text-anchor="middle">3</text>
    <text x="446" y="89" class="b">Plataforma</text>
    <text x="422" y="116" class="t">Escaparate: TikTok,</text>
    <text x="422" y="134" class="t">Instagram</text>
    <text x="422" y="152" class="t">Sala cerrada: WhatsApp,</text>
    <text x="422" y="170" class="t">Telegram, Discord</text>
  </g>
  <g>
    <rect x="600" y="64" width="172" height="150" rx="10" fill="#fce7f3" stroke="#ec4899"/>
    <circle cx="620" cy="84" r="12" fill="#ec4899"/><text x="620" y="89" class="n" text-anchor="middle">4</text>
    <text x="638" y="89" class="b">Símbolo</text>
    <text x="614" y="116" class="t">Etiqueta importada:</text>
    <text x="614" y="134" class="t">bandera One Piece,</text>
    <text x="614" y="152" class="t">«blocus», «como en</text>
    <text x="614" y="170" class="t">Francia»</text>
  </g>
  <g>
    <rect x="792" y="64" width="184" height="150" rx="10" fill="#fee2e2" stroke="#ef4444"/>
    <circle cx="812" cy="84" r="12" fill="#ef4444"/><text x="812" y="89" class="n" text-anchor="middle">5</text>
    <text x="830" y="89" class="b">Respuesta estatal</text>
    <text x="806" y="116" class="t">Detenciones, límites a</text>
    <text x="806" y="134" class="t">las marchas, discurso</text>
    <text x="806" y="152" class="t">de «ley y orden» o de</text>
    <text x="806" y="170" class="t">«injerencia»</text>
  </g>

  <line x1="196" y1="139" x2="214" y2="139" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="388" y1="139" x2="406" y2="139" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="580" y1="139" x2="598" y2="139" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="772" y1="139" x2="790" y2="139" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <path d="M884 216 L884 262 L110 262 L110 218" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a)"/>
  <text x="497" y="254" class="b" text-anchor="middle" fill="#b91c1c">La represión se convierte en nuevo detonante</text>

  <rect x="24" y="284" width="952" height="40" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="40" y="309" class="s">Amplificadores externos (cuentas coordinadas, medios, actores políticos) se enganchan en las piezas 3 y 4. Su peso es lo que hay que probar, no suponer.</text>
</svg>
