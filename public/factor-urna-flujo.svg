<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 270" role="img" aria-labelledby="t d" class="chart"><title id="t">Cómo se traduce el voto en escaños</title><desc id="d">Esquema de tres capas: censo, participación y reparto de escaños. No es una cadena automática ni una predicción.</desc><rect width="940" height="270" fill="#ffffff"/><style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace} .axis{stroke:#cbd5e1;stroke-width:1} .grid{stroke:#e2e8f0;stroke-width:1} .lab{fill:#334155;font-size:13px} .small{fill:#64748b;font-size:11px} .big{fill:#0f172a;font-size:20px;font-weight:700}</style><text x="24" y="30" class="big">Cómo se traduce el voto en escaños</text><text x="24" y="48" class="small">Tres capas distintas; ninguna es una cadena automática</text><rect x="40" y="95" width="240" height="92" rx="8" fill="#0f766e" opacity=".10" stroke="#0f766e" stroke-width="2"/><text x="160" y="128" text-anchor="middle" font-size="17" font-weight="800" fill="#0f766e">CENSO</text><text x="160" y="153" text-anchor="middle" class="lab">Quién puede votar</text><rect x="350" y="95" width="240" height="92" rx="8" fill="#f97316" opacity=".10" stroke="#f97316" stroke-width="2"/><text x="470" y="128" text-anchor="middle" font-size="17" font-weight="800" fill="#f97316">PARTICIPACIÓN</text><text x="470" y="153" text-anchor="middle" class="lab">Quién vota</text><rect x="660" y="95" width="240" height="92" rx="8" fill="#1d4ed8" opacity=".10" stroke="#1d4ed8" stroke-width="2"/><text x="780" y="128" text-anchor="middle" font-size="17" font-weight="800" fill="#1d4ed8">ESCAÑOS</text><text x="780" y="153" text-anchor="middle" class="lab">Cómo se traduce</text><path d="M290 141 H335" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M600 141 H645" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs><text x="24" y="225" class="small">La participación no se convierte en escaños de forma proporcional: depende de la provincia, del umbral del 3 % y de D’Hondt.</text></svg>