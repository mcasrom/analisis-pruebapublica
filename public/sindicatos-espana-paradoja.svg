<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="sindicatos-espana-paradoja.svg"><rect width="960" height="420" fill="#f7f4ec"/><text x="52" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1f2933" text-anchor="start">La paradoja sindical</text><text x="52" y="88" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" fill="#5f6b76" text-anchor="start">Misma escala 0–100 %. Universos distintos.</text><text x="52" y="133" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1f2933" text-anchor="start">Afiliación sindical (2023)</text><rect x="52" y="145" width="92.5" height="36" rx="6" fill="#d98b13"/><text x="156.5" y="170" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" fill="#d98b13" text-anchor="start">12,5 %</text><text x="52" y="248" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1f2933" text-anchor="start">Cobertura ajustada de convenios (2024)</text><rect x="52" y="260" width="681.54" height="36" rx="6" fill="#1f8a78"/><text x="745.54" y="285" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1f8a78" text-anchor="start">92,1 %</text><line x1="52" y1="335" x2="792" y2="335" stroke="#d8d1c2" stroke-width="2"/><text x="52" y="370" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" fill="#5f6b76" text-anchor="start">Afiliación: % de asalariados. Cobertura: % de trabajadores con derecho a negociar.</text><text x="52" y="395" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" fill="#5f6b76" text-anchor="start">Fuente: OCDE/AIAS, España, 2025. No son el mismo indicador ni el mismo año.</text></svg>